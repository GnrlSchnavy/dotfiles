name: fresh-install test

# End-to-end test: install Nix, then run `./setup.sh` itself against the
# `ci` and `ci-work` host descriptors (m5's and the work Mac's profiles on
# the runner). Catches eval errors,
# build failures, activation script errors, home-manager activation
# issues, and brew-bundle issues — the full surface area we'd
# otherwise only discover by running setup on a fresh machine.
#
# The CI hosts skip casks (some have DSL incompatibilities specific
# to the runner image) and disable homebrew zap/upgrade, keeping runs
# to ~10-15 min while still exercising the full path. The runner is
# macOS 27 on Apple Silicon, like the real host. GitHub now names macOS
# images after their Xcode version, so the macOS 27 image is `xcode-27`
# (public preview). If it queues or misbehaves, `macos-26` is the GA
# fallback.

# No path filters: master's ruleset requires these checks, and a filtered-out
# PR would never report them. Docs changes need the gitleaks scan and the
# docs drift test too.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    # Fast gate on Linux (~2 min): evaluates every host — eval works
    # cross-platform, so a typo fails here before the macOS job starts — and
    # runs the bash tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: lint's gitleaks scans every commit, not just the tree.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate every host (no build)
        run: nix flake check --no-build --all-systems ./nix

      # nixfmt, statix, deadnix, shellcheck and gitleaks (tree and every
      # commit); the same script the pre-commit hook runs.
      - name: Lint
        run: nix develop ./nix --command scripts/lint.sh

      # The fresh install below drops casks, so a cask Homebrew has disabled
      # would only fail on a real machine's first install.
      - name: No disabled Homebrew casks or formulae
        run: scripts/check-brew.sh m5 work

      - name: Settings-merge and agent tests
        run: tests/run.sh

  # One fresh install per role: `ci` mirrors m5 (dev + personal), `ci-work`
  # the work Mac (dev + work). They run in parallel.
  fresh-install:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        host: [ci, ci-work]
    name: fresh-install (${{ matrix.host }})
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # GITHUB_TOKEN gives us a higher rate limit when nix fetches
          # flake inputs from github.com (otherwise we share an
          # anonymous IP pool and 403 quickly).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-users = root runner
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Use the public Nix cache
        # Pull from nix-community for nixvim/home-manager artifacts that
        # aren't on cache.nixos.org. Cuts a few minutes off cold runs.
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-community
          skipPush: true

      # Third-party tap trust is handled declaratively during
      # activation by nix/modules/homebrew-trust.nix — this run also
      # serves as its end-to-end test.
      - name: Run setup.sh against the ${{ matrix.host }} host
        # The real bootstrap script on this checkout. Xcode CLT, Homebrew
        # and Nix are already on the runner, so it skips those installers,
        # moves the /etc files aside and applies the host.
        # NIX_CONFIG carries the GitHub token (higher rate limit for input
        # fetches) through sudo: setup.sh moves aside the nix.conf that
        # install-nix-action wrote it to, and root doesn't read ours.
        env:
          DOTFILES_DIR: ${{ github.workspace }}
          DOTFILES_HOST: ${{ matrix.host }}
          NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        run: ./setup.sh

      - name: Verify activation produced the expected symlinks
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail

          # nix-darwin's profile and home-manager's profile aren't on
          # PATH yet — that happens in new shells via the activation
          # script's PATH manipulation. Explicitly prepend so this
          # bash step can see the binaries it just installed.
          export PATH="/run/current-system/sw/bin:/etc/profiles/per-user/runner/bin:$PATH"

          fail() { echo "::error::$1"; exit 1; }

          # home-manager managed shell files
          [ -L ~/.zshrc ]    || fail "~/.zshrc is not a symlink"
          [ -L ~/.zprofile ] || fail "~/.zprofile is not a symlink"
          [ -L ~/.zshenv ]   || fail "~/.zshenv is not a symlink"

          # home-manager managed git config (XDG)
          [ -L ~/.config/git/config ] || fail "~/.config/git/config is not a symlink"
          [ -L ~/.config/git/ignore ] || fail "~/.config/git/ignore is not a symlink"

          # home-manager file-pointer dotfiles
          [ -L ~/.ideavimrc ] || fail "~/.ideavimrc is not a symlink"

          # Claude Code: settings.json is a regular (app-owned) file with the
          # owned keys merged in.
          s=~/.claude/settings.json
          if [ ! -f "$s" ] || [ -L "$s" ]; then fail "$s is not a regular file"; fi
          jq -e '.enabledPlugins["codemem@codemem-marketplace"] == true' \
            "$s" >/dev/null || fail "$s doesn't declare the codemem plugin"
          jq -e '(.permissions.deny | index("Read(~/.ssh/**)")) and (.sandbox.filesystem.denyRead | index("~/.codemem"))' \
            "$s" >/dev/null || fail "$s lacks the secret read-denies"

          case "$HOST" in
            ci) # personal profile: Max with the Bash sandbox, vault skills
              jq -e '.sandbox.enabled == true' "$s" >/dev/null || fail "$s lacks the sandbox"
              jq -e --arg c "$HOME/.cache/claude-sandbox" '.sandbox.filesystem.allowWrite == [$c]' \
                "$s" >/dev/null || fail "$s: the sandbox may write outside its own caches"
              jq -e --arg g "$HOME/.ssh/proton-pass-git-agent.sock" --arg a "$HOME/.ssh/proton-pass-agent.sock" \
                '.sandbox.network.allowUnixSockets | index($g) and (index($a) | not)' \
                "$s" >/dev/null || fail "$s: the sandbox must get the git SSH agent only"
              [ -d ~/.codemem/personal ] || fail "codemem dir missing"
              if grep -rq '@VAULT@' ~/.claude/skills/; then fail "vault path not filled in the skills"; fi
              ;;
            ci-work) # work profile: gateway check, overlay, cc-work, AKS tools
              hook=~/.claude/hooks/gateway-check.sh
              [ -x "$hook" ] || fail "$hook is not executable"
              jq -e --arg h "$hook" '[.hooks.PreToolUse[].hooks[].command] | index($h)' \
                "$s" >/dev/null || fail "$s lacks the gateway-check hook"
              jq -e '.skipWebFetchPreflight == true' "$s" >/dev/null || fail "$s lacks skipWebFetchPreflight"
              [ -d ~/.codemem/work ] || fail "codemem dir missing"
              grep -q 'cc-work()' ~/.zshrc || fail "cc-work isn't defined in ~/.zshrc"
              for tool in cc-tooling m2-render az kubelogin; do
                command -v "$tool" >/dev/null || fail "$tool not on PATH"
              done
              ;;
            *) fail "no smoke checks for host $HOST" ;;
          esac

          # darwin-rebuild ships in the system profile
          command -v darwin-rebuild >/dev/null || fail "darwin-rebuild not on PATH"

          # mise (Java/Node) ships in the home-manager profile, with its config
          command -v mise >/dev/null || fail "mise not on PATH"
          [ -L ~/.config/mise/config.toml ] || fail "~/.config/mise/config.toml is not a symlink"
          # ...and macOS finds the JDK it installed (mise.nix links it)
          jvms="$(/usr/libexec/java_home -V 2>&1 || true)"
          for v in 25 21; do
            grep -q "/mise-temurin-$v" <<<"$jvms" || fail "java_home doesn't list mise's Temurin $v: $jvms"
          done

          # The weekly backup agent (nix/home/backup.nix) is loaded and, run
          # through launchd, leaves a backup behind
          label="gui/$(id -u)/org.nix-community.home.dotfiles-backup"
          launchctl print "$label" >/dev/null || fail "$label isn't loaded"
          launchctl kickstart "$label"
          for _ in $(seq 30); do
            compgen -G "$HOME/.dotfiles-backups/*/README.md" >/dev/null && break
            sleep 2
          done
          compgen -G "$HOME/.dotfiles-backups/*/README.md" >/dev/null \
            || fail "the backup agent left no backup: $(cat ~/Library/Logs/dotfiles-backup.log 2>/dev/null)"

          # Brew bundle should have left the declared formulas installed —
          # both from third-party taps, so this covers homebrew-trust.nix too
          command -v brew >/dev/null || fail "brew not on PATH"
          for formula in flux pass-cli; do
            brew list --formula "$formula" >/dev/null 2>&1 || fail "brew formula $formula missing after activation"
          done

          # CLI tools come from nixpkgs (profiles/dev/packages.nix)
          for tool in kubectl helm gh; do
            command -v "$tool" >/dev/null || fail "$tool not on PATH"
          done

          echo "All smoke checks passed."
