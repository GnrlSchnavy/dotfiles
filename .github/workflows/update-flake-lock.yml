name: update flake.lock

# Weekly pull request bumping nix/flake.lock, so inputs don't sit months
# behind again. check.yml tests the PR like any other.
#
# PRs opened with the default GITHUB_TOKEN don't trigger other workflows,
# so check.yml would not run on them. Add a fine-grained token for this
# repo (Contents + Pull requests: read and write) as the FLAKE_UPDATE_TOKEN
# secret to have CI run on the PR; without it, run check.yml on the
# branch by hand (Actions → fresh-install test → Run workflow).

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock and open a PR
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          path-to-flake-dir: nix
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          pr-title: "flake: update inputs"
          commit-msg: "flake: update inputs"
